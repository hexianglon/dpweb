<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>精美网页首页</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

body{
  margin:0;
  font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  color:#333;
  background:#fafafa;
}

/* 顶部导航 */
header{
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.nav{
  max-width:1200px;
  margin:auto;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:22px;
  font-weight:bold;
  color:#2266ff;
  letter-spacing:1px;
}
nav a{
  text-decoration:none;
  margin-left:25px;
  color:#333;
  font-size:15px;
}
nav a:hover{
  color:#2266ff;
}

/* Banner */
.banner{
  background:linear-gradient(120deg,#5f9cff,#8cc8ff);
  color:#fff;
  text-align:center;
  padding:120px 20px 140px;
}
.banner h1{
  font-size:42px;
  margin:0;
}
.banner p{
  font-size:18px;
  opacity:.9;
  margin-top:12px;
}
.btn{
  margin-top:25px;
  padding:12px 32px;
  background:#fff;
  border-radius:30px;
  text-decoration:none;
  font-size:15px;
  display:inline-block;
  color:#2d7bff;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}
.btn:hover{
  background:#eef4ff;
}

/* 内容区 */
.section{
  max-width:1200px;
  margin: -70px auto 60px;
  display:flex;
  gap:25px;
  padding:0 25px;
  flex-wrap:wrap;
}
.card{
  background:#fff;
  flex:1;
  min-width:260px;
  padding:28px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.06);
}
.card h3{
  margin-top:0;
  color:#2266ff;
}
.card p{
  color:#555;
}

/* 底部 */
footer{
  text-align:center;
  background:#111;
  color:#aaa;
  padding:35px 20px;
  margin-top:60px;
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">My Web</div>
    <nav>
      <a href="#">首页</a>
      <a href="#">服务</a>
      <a href="#">案例</a>
      <a href="#">关于我们</a>
      <a href="#">联系我们</a>
    </nav>
  </div>
</header>

<section class="banner">
  <h1>欢迎来到精美网页设计首页</h1>
  <p>简洁 · 大方 · 现代 · 自适应，让网页更有气质</p>
  <a class="btn" href="#">开始体验</a>
</section>

<section class="section">
  <div class="card">
    <h3>现代设计</h3>
    <p>柔和渐变 + 圆角卡片，视觉干净优雅，用户体验友好。</p>
  </div>

  <div class="card">
    <h3>纯静态HTML</h3>
    <p>无需框架，无JS，无依赖，轻量好部署，修改方便。</p>
  </div>

  <div class="card">
    <h3>自适应布局</h3>
    <p>支持电脑与移动端浏览，自动排版，始终保持美观。</p>
  </div>
</section>

<footer>
  © 2025 精美网页设计 · All Rights Reserved
</footer>

</body>
</html>
